name: asmr-shorts

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Random delay
        if: github.event_name == 'schedule'
        run: |
          D=$((RANDOM % 10800))
          echo "Sleeping $D seconds"
          sleep $D

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Write credentials
        env:
          RT: ${{ secrets.YT_REFRESH_TOKEN }}
          CID: ${{ secrets.YT_CLIENT_ID }}
          CS: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json, os
          d = {
            "token": "x",
            "refresh_token": os.environ["RT"],
            "token_uri": "https://oauth2.googleapis.com/token",
            "client_id": os.environ["CID"],
            "client_secret": os.environ["CS"],
            "scopes": ["https://www.googleapis.com/auth/youtube.upload"],
            "expiry": "2000-01-01T00:00:00Z",
          }
          json.dump(d, open("token.json", "w"))
          PY

      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python asmr_auto.py

      - name: Save history
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "update history" && git push)
